<!doctype html>
<!-- The page of `spirula gui --remote`: shows the GUI's frames and sends this
     browser's input back. Served by src/app/gui/RemoteDisplay.cpp, which is
     where the protocol is defined. docs/notes/remote-gui.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirula Studio (remote)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #121214; overflow: hidden;
               font: 13px system-ui, sans-serif; color: #ddd; }
  #screen { position: fixed; left: 0; top: 0; display: block; outline: none;
            user-select: none; -webkit-user-drag: none; image-rendering: auto; }
  #banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%);
            background: #2a2a30; border: 1px solid #444; border-radius: 6px;
            padding: 8px 12px; display: none; max-width: 90vw; z-index: 2; }
  #banner a { color: #8ab4f8; word-break: break-all; }
  #banner button { margin-left: 10px; }
  #state { position: fixed; right: 8px; bottom: 6px; opacity: .55; z-index: 2;
           pointer-events: none; }
  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
           background: #232328; border: 1px solid #555; border-radius: 8px; padding: 14px;
           z-index: 3; display: none; box-shadow: 0 8px 30px #0008; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; }
  .panel .dir { color: #9a9; word-break: break-all; margin-bottom: 10px; }
  #upload { width: min(560px, 90vw); }
  #upload .zone { border: 2px dashed #555; border-radius: 6px; padding: 18px; text-align: center;
                  margin: 10px 0; color: #aaa; }
  #upload .zone.over { border-color: #8ab4f8; color: #fff; }
  #upload ul { max-height: 40vh; overflow: auto; margin: 0; padding-left: 18px; }
  #upload li.err { color: #f99; }
  #upload progress { width: 100%; }
  #player { width: min(1100px, 92vw); }
  #player video { width: 100%; max-height: 75vh; background: #000; }
  #drop { position: fixed; inset: 0; background: #1e3a5f99; z-index: 4; display: none;
          align-items: center; justify-content: center; font-size: 18px; pointer-events: none; }
  button { font: inherit; }
</style>
</head>
<body>
<img id="screen" alt="" tabindex="0" draggable="false">
<div id="banner"></div>
<div id="state">connecting</div>
<div id="drop"></div>
<div id="upload" class="panel">
  <h3>Upload to the server</h3>
  <div class="dir" id="up-dir"></div>
  <button id="up-files">Choose files...</button>
  <button id="up-folder">Choose a folder...</button>
  <button id="up-close" style="float:right">Close</button>
  <div class="zone" id="up-zone">or drop files and folders here</div>
  <progress id="up-progress" max="1" value="0" hidden></progress>
  <ul id="up-list"></ul>
  <input id="up-input-files" type="file" multiple hidden>
  <input id="up-input-folder" type="file" webkitdirectory hidden>
</div>
<div id="player" class="panel">
  <button id="player-close" style="float:right">Close</button>
  <h3 id="player-name"></h3>
  <video id="player-video" controls preload="metadata"></video>
</div>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const q = s => s + (s.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
const screen = document.getElementById("screen");
const state = document.getElementById("state");
const banner = document.getElementById("banner");
// On a Mac the Cmd key is what Ctrl is on the pod.
const mac = /Mac|iPhone|iPad/.test(navigator.platform);

// ---- input: batched, in order, one request in flight ----------------------
let queue = [], sending = false;
function push(ev) {
  const last = queue[queue.length - 1];
  if (ev.t === "m" && last && last.t === "m") queue[queue.length - 1] = ev;
  else queue.push(ev);
  if (!sending) flush();
}
async function flush() {
  sending = true;
  while (queue.length) {
    const batch = queue; queue = [];
    try {
      await fetch(q("/remote/input?e=" + encodeURIComponent(JSON.stringify(batch))),
                  {cache: "no-store"});
    } catch (e) { /* the stream's own reconnect reports it */ }
  }
  sending = false;
}
function mods(e) {
  return {c: (e.ctrlKey || (mac && e.metaKey)) ? 1 : 0, s: e.shiftKey ? 1 : 0,
          a: e.altKey ? 1 : 0, m: (!mac && e.metaKey) ? 1 : 0};
}
// The frame's size comes from /remote/status: an <img> on a multipart stream
// keeps the first part's naturalWidth for good.
let frameW = 0, frameH = 0;
function pos(e) {
  const r = screen.getBoundingClientRect();
  const sx = frameW && r.width ? frameW / r.width : 1, sy = frameH && r.height ? frameH / r.height : 1;
  return {x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy};
}

// ---- size: the GUI's window follows this page's ---------------------------
let sizeTimer = 0;
function sendSize() {
  clearTimeout(sizeTimer);
  sizeTimer = setTimeout(() => {
    const w = Math.max(320, Math.floor(innerWidth)), h = Math.max(240, Math.floor(innerHeight));
    push({t: "size", w, h});
  }, 120);
}
addEventListener("resize", sendSize);

// ---- the frame stream -------------------------------------------------------
let connected = false, lastFrame = -1;
function connect() {
  state.textContent = "connecting";
  screen.src = q("/remote/stream?n=" + Date.now());
  sendSize();
}
// An <img> on a multipart stream fires "load" for the first part only.
screen.addEventListener("load", () => {
  if (!connected) { connected = true; sendSize(); }
});
screen.addEventListener("error", () => {
  connected = false;
  state.textContent = "disconnected, retrying";
  setTimeout(connect, 2000);
});

// ---- mouse -------------------------------------------------------------------
const BUTTON = {0: 0, 1: 2, 2: 1};   // DOM left/middle/right -> ImGui left/right/middle
screen.addEventListener("pointermove", e => push({t: "m", ...pos(e)}));
screen.addEventListener("pointerdown", e => {
  screen.focus({preventScroll: true});
  screen.setPointerCapture(e.pointerId);
  push({t: "m", ...pos(e)});
  if (e.button in BUTTON) push({t: "b", b: BUTTON[e.button], d: 1});
  e.preventDefault();
});
screen.addEventListener("pointerup", e => {
  push({t: "m", ...pos(e)});
  if (e.button in BUTTON) push({t: "b", b: BUTTON[e.button], d: 0});
  e.preventDefault();
});
screen.addEventListener("contextmenu", e => e.preventDefault());
screen.addEventListener("wheel", e => {
  const unit = e.deltaMode === 1 ? 1 / 3 : e.deltaMode === 2 ? 3 : 1 / 100;
  push({t: "w", x: -e.deltaX * unit, y: -e.deltaY * unit});
  e.preventDefault();
}, {passive: false});

// ---- keyboard ----------------------------------------------------------------
const held = new Set();
function key(e, down) {
  if (e.isComposing || panelOpen()) return;
  let code = e.code;
  if (mac && code === "MetaLeft") code = "ControlLeft";
  if (mac && code === "MetaRight") code = "ControlRight";
  const m = mods(e);
  // Ctrl+V comes through the paste event, which carries this browser's clipboard.
  if (down && m.c && code === "KeyV") return;
  if (down) held.add(code); else held.delete(code);
  push({t: "k", code, d: down ? 1 : 0, ...m});
  if (down && e.key.length === 1 && !m.c && !m.m) push({t: "t", v: e.key});
  e.preventDefault();
}
addEventListener("keydown", e => key(e, true));
addEventListener("keyup", e => key(e, false));
addEventListener("paste", e => {
  if (panelOpen()) return;
  const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
  push({t: "clip", v: text});
  push({t: "k", code: "KeyV", d: 1, c: 1});
  push({t: "k", code: "KeyV", d: 0, c: 1});
  e.preventDefault();
});
addEventListener("blur", () => {
  for (const code of held) push({t: "k", code, d: 0});
  held.clear();
  push({t: "f", d: 0});
});
addEventListener("focus", () => push({t: "f", d: 1}));

// ---- what the GUI asks of this page -----------------------------------------
const $ = id => document.getElementById(id);
const base = p => p.split(/[\\/]/).filter(Boolean).pop() || p;
const fileUrl = (route, path) =>
  "/remote/" + route + "/" + encodeURIComponent(base(path)) + "?path=" + encodeURIComponent(path);
function panelOpen() {
  return $("upload").style.display === "block" || $("player").style.display === "block";
}
// Opening a tab needs a click on this page, so a link waits in the banner.
function showBanner(text, label, action) {
  banner.textContent = text + " ";
  const go = document.createElement("button");
  go.textContent = label;
  go.onclick = () => { action(); banner.style.display = "none"; };
  const close = document.createElement("button");
  close.textContent = "Close";
  close.onclick = () => { banner.style.display = "none"; };
  banner.append(go, close);
  banner.style.display = "block";
}
function onEvent(ev) {
  if (ev.t === "url") {
    showBanner("The GUI wants to open " + ev.v, "Open", () => window.open(ev.v, "_blank", "noopener"));
  } else if (ev.t === "viewer") {
    const model = fileUrl("raw", ev.v);
    showBanner("Open " + base(ev.v) + " in the Spirula Viewer", "Open",
               () => window.open("/viewer/index.html?model=" + encodeURIComponent(model), "_blank"));
  } else if (ev.t === "download") {
    const a = document.createElement("a");
    a.href = fileUrl("download", ev.v);
    a.download = "";
    document.body.append(a);
    a.click();
    a.remove();
  } else if (ev.t === "upload") {
    openUpload(ev.v);
  } else if (ev.t === "play") {
    $("player-name").textContent = base(ev.v);
    $("player-video").src = fileUrl("raw", ev.v);
    $("player").style.display = "block";
  }
}
$("player-close").onclick = () => {
  $("player-video").pause();
  $("player-video").removeAttribute("src");
  $("player-video").load();
  $("player").style.display = "none";
  screen.focus({preventScroll: true});
};

// ---- uploads: one file at a time, each as one POST ---------------------------
let upDir = "", uploading = false, upQueue = [];
function openUpload(dir) {
  upDir = dir;
  $("up-dir").textContent = dir;
  $("upload").style.display = "block";
}
$("up-close").onclick = () => { $("upload").style.display = "none"; screen.focus({preventScroll: true}); };
$("up-files").onclick = () => $("up-input-files").click();
$("up-folder").onclick = () => $("up-input-folder").click();
for (const id of ["up-input-files", "up-input-folder"])
  $(id).onchange = e => {
    enqueue([...e.target.files].map(f => ({file: f, name: f.webkitRelativePath || f.name})));
    e.target.value = "";
  };
function postFile(item, overwrite) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open("POST", "/remote/upload?dir=" + encodeURIComponent(upDir) + "&name=" +
           encodeURIComponent(item.name) + (overwrite ? "&overwrite=1" : ""));
    x.upload.onprogress = e => { if (e.lengthComputable) item.bar(e.loaded / e.total); };
    x.onload = () => resolve(x.status);
    x.onerror = () => resolve(0);
    x.send(item.file);
  });
}
function enqueue(items) {
  for (const it of items) {
    const li = document.createElement("li");
    li.textContent = it.name + " (" + (it.file.size / 1048576).toFixed(1) + " MB)";
    $("up-list").append(li);
    it.li = li;
    it.bar = f => { $("up-progress").value = f; };
    upQueue.push(it);
  }
  if (!uploading) runUploads();
}
async function runUploads() {
  uploading = true;
  $("up-progress").hidden = false;
  while (upQueue.length) {
    const it = upQueue.shift();
    it.li.textContent += " ...";
    let status = await postFile(it, false);
    if (status === 409 && confirm(it.name + " already exists there. Replace it?"))
      status = await postFile(it, true);
    it.li.textContent = it.li.textContent.replace(/ \.\.\.$/, status === 200 ? " - done" :
                        status === 409 ? " - skipped" : " - failed (" + status + ")");
    if (status !== 200 && status !== 409) it.li.className = "err";
  }
  $("up-progress").hidden = true;
  uploading = false;
}
// A dropped folder arrives as a tree to walk; its files keep their paths.
async function droppedFiles(dt) {
  const out = [];
  const walk = async (entry, prefix) => {
    if (entry.isFile) {
      const file = await new Promise((ok, no) => entry.file(ok, no));
      out.push({file, name: prefix + file.name});
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
        if (!batch.length) break;
        for (const e of batch) await walk(e, prefix + entry.name + "/");
      }
    }
  };
  // Read before the first await: the browser empties dt once the event returns.
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const plain = [...dt.files].map(file => ({file, name: file.name}));
  for (const e of entries) await walk(e, "");
  return entries.length ? out : plain;
}
let dropDir = "";
addEventListener("dragover", e => {
  if (![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault();
  $("drop").textContent = dropDir ? "Drop to upload into " + dropDir
                                  : "Open File > Browse Files... to choose where uploads go";
  $("drop").style.display = "flex";
});
addEventListener("dragleave", e => { if (!e.relatedTarget) $("drop").style.display = "none"; });
addEventListener("drop", async e => {
  e.preventDefault();
  $("drop").style.display = "none";
  const target = $("upload").style.display === "block" ? upDir : dropDir;
  if (!target) return;
  if ($("upload").style.display !== "block") openUpload(target);
  enqueue(await droppedFiles(e.dataTransfer));
});

// ---- status: cursor, the GUI's clipboard, what it asks of this page ---------
let clipSeen = -1, eventsSeen = -1;
async function poll() {
  try {
    const r = await fetch(q("/remote/status?events=" + Math.max(0, eventsSeen)), {cache: "no-store"});
    const s = await r.json();
    screen.style.cursor = s.cursor;
    if (s.w && (s.w !== frameW || s.h !== frameH)) {
      frameW = s.w; frameH = s.h;
      screen.style.width = frameW + "px";
      screen.style.height = frameH + "px";
    }
    if (clipSeen >= 0 && s.clip !== clipSeen) {
      const text = await (await fetch(q("/remote/clipboard"), {cache: "no-store"})).text();
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    }
    clipSeen = s.clip;
    dropDir = s.drop || "";
    // What the GUI asked before this page connected is not this page's to do.
    if (eventsSeen < 0) eventsSeen = s.last;
    else for (const ev of s.events) { eventsSeen = Math.max(eventsSeen, ev.n); onEvent(ev); }
    const fps = lastFrame < 0 ? 0 : (s.frame - lastFrame) * 2;
    lastFrame = s.frame;
    if (connected) state.textContent = s.w + "×" + s.h + "  " + fps + " fps";
  } catch (e) { /* retried on the next tick */ }
  setTimeout(poll, 500);
}

connect();
poll();
screen.focus({preventScroll: true});
</script>
</body>
</html>
